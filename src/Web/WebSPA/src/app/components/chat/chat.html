<div class="chat-container">
  <h3>Chat sa korisnikom: {{ receiverId }}</h3>

  <!-- Lista poruka sa skrolom -->
  <div class="messages-list" #scrollContainer (scroll)="onScroll()">
    <div *ngFor="let msg of messages"
         class="message-item"
         [ngClass]="{'sent': msg.senderId === myId, 'received': msg.senderId !== myId}">

      <span class="message-content">{{ msg.content }}</span>
      <span class="message-time" *ngIf="msg.timestamp">{{ msg.timestamp | date:'HH:mm' }}</span>
    </div>
  </div>

  <!-- Plutajuće dugme na desnoj strani -->
  <div class="new-message-badge"
       *ngIf="unreadCount > 0"
       (click)="scrollToBottomManual()">
    <span>Nova poruka ({{ unreadCount }})</span>
    <svg viewBox="0 0 24 24">
      <path d="M11 4v12.17l-5.58-5.59L4 12l8 8 8-8-1.41-1.41L13 16.17V4h-2z" />
    </svg>
  </div>

  <!-- Polje za unos poruke -->
  <div class="chat-input-container">
    <input type="text"
           [(ngModel)]="newMessageContent"
           (keyup.enter)="sendMessage()"
           placeholder="Ukucajte poruku..." />
    <button (click)="sendMessage()">Pošalji</button>
  </div>
</div>
