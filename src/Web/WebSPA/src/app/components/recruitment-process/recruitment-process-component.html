<div class="profile-container" *ngIf="process(); else noProcess">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Recruitment Process Details</mat-card-title>
      <mat-card-subtitle>Active: {{ process()?.isActive }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Total Rounds: {{ process()?.rounds?.length }}</p>

      <ul class="rounds-list">
        <li *ngFor="let round of process()?.rounds">
          <strong>{{ round.orderIndex }}. {{ round.title }}</strong>
          <p *ngIf="round.description">{{ round.description }}</p>
        </li>
      </ul>
    </mat-card-content>
    <mat-card-actions>
       <button mat-button color="primary" (click)="editRounds()">Edit Rounds</button>
    </mat-card-actions>
  </mat-card>
</div>

<ng-template #noProcess>
  <div class="profile-container">
    <div class="empty-state">
      <p>No active recruitment process found for this job.</p>
      <button mat-raised-button color="accent" (click)="initializeProcess()">Initialize Process</button>
    </div>
  </div>
</ng-template>
