<h2 mat-dialog-title>{{ data.schedule ? 'Edit Interview' : 'Schedule Interview' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="schedule-form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" placeholder="Interview with Candidate">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Technical interview..."></textarea>
    </mat-form-field>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Start Time (HH:mm)</mat-label>
        <input matInput type="time" formControlName="startTime" />
      </mat-form-field>
    </div>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>End Time (HH:mm)</mat-label>
        <input matInput type="time" formControlName="endTime" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Additional Attendee Emails (optional, comma separated)</mat-label>
      <input matInput formControlName="attendeeEmails" placeholder="hr@example.com, panel@example.com">
      <mat-hint>The candidate's email is added automatically.</mat-hint>
    </mat-form-field>
  </form>

  @if (error(); as message) {
    <p class="error-message">{{ message }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading()">
    {{ loading() ? 'Saving...' : (data.schedule ? 'Save Changes' : 'Schedule') }}
  </button>
</mat-dialog-actions>
