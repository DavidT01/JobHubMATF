<h2 mat-dialog-title>{{ showCancel ? 'Confirm action' : 'Profile updated' }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (showCancel) {
    <button mat-button (click)="onCancel()">Cancel</button>
  }
  <button mat-raised-button color="primary" (click)="onConfirm()">{{ confirmLabel }}</button>
</mat-dialog-actions>
