<section class="page">
  <app-page-header [title]="greeting()" [subtitle]="subtitle()" />

  <div class="card-grid">
    @for (item of quickLinks(); track item.link) {
      <a class="quick-link" [routerLink]="item.link">
        <mat-card appearance="outlined" class="clickable-card quick-link__card">
          <mat-icon class="quick-link__icon">{{ item.icon }}</mat-icon>
          <span class="quick-link__label">{{ item.label }}</span>
        </mat-card>
      </a>
    }
  </div>
</section>
