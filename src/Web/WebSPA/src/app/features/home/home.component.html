<div class="home-container">
  <mat-card class="home-card">
    <mat-card-header>
      <mat-card-title>JobHub</mat-card-title>
      <mat-card-subtitle>You are signed in</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (user(); as profile) {
        <p><strong>Email:</strong> {{ profile.email }}</p>
        <p><strong>Name:</strong> {{ profile.firstName }} {{ profile.lastName }}</p>
        <p><strong>Roles:</strong> {{ profile.roles.join(', ') }}</p>
      }
    </mat-card-content>
    <mat-card-actions class="actions">
      <a mat-stroked-button routerLink="/notifications">
        Notifications
        @if (unreadCount() > 0) {
          ({{ unreadCount() }})
        }
      </a>
      @if (isAdmin()) {
        <a mat-stroked-button routerLink="/admin">Admin</a>
      }
      <button mat-flat-button color="primary" type="button" (click)="logout()">Sign out</button>
    </mat-card-actions>
  </mat-card>
</div>
