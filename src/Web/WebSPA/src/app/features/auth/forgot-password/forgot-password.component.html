<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
      <mat-card-subtitle>We will prepare a reset link for your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="example@email.com">
          <mat-icon matSuffix>email</mat-icon>
          @if (form.get('email')?.hasError('required')) {
            <mat-error>Email is required</mat-error>
          }
          @if (form.get('email')?.hasError('email')) {
            <mat-error>Invalid email format</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid" class="submit-button">
          SEND RESET LINK
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="auth-footer">
      <p><a routerLink="/login">Back to sign in</a></p>
    </mat-card-footer>
  </mat-card>
</div>
